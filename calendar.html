<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar · TASKFLOW</title>
  <meta name="description" content="TASKFLOW – Manage Your Day Smarter.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('tf-theme') || 'light'; } catch (e) {}</script>
</head>
<body data-page="calendar">
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <div class="page-loader" id="pageLoader" role="status" aria-label="Loading"><div class="spinner"></div></div>

      <main class="content" id="content" hidden>
      <div class="cal-toolbar">
        <h2 id="calTitle"></h2>
        <div class="cal-nav">
          <button class="btn btn-secondary btn-sm" id="calToday">Today</button>
          <button class="icon-btn" id="calPrev" aria-label="Previous"><i data-lucide="chevron-left"></i></button>
          <button class="icon-btn" id="calNext" aria-label="Next"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="view-switch" role="tablist" aria-label="Calendar view">
          <button data-cal-view="month" role="tab">Month</button>
          <button data-cal-view="week" role="tab">Week</button>
          <button data-cal-view="day" role="tab">Day</button>
        </div>
      </div>

      <div class="cal-layout">
        <section class="card cal-card" id="calView" aria-live="polite"></section>
        <aside class="card day-panel" id="dayPanel">
          <div class="card-header">
            <div><h3 id="panelTitle"></h3><p id="panelSub"></p></div>
            <button class="btn btn-primary btn-sm" id="panelAdd"><i data-lucide="plus"></i>Add</button>
          </div>
          <div id="panelList"></div>
        </aside>
      </div>
      </main>
    </div>
  </div>
  <div id="toastContainer"></div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
