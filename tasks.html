<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks · TASKFLOW</title>
  <meta name="description" content="TASKFLOW – Manage Your Day Smarter.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('tf-theme') || 'light'; } catch (e) {}</script>
</head>
<body data-page="tasks">
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <div class="page-loader" id="pageLoader" role="status" aria-label="Loading"><div class="spinner"></div></div>

      <main class="content" id="content" hidden>
      <nav class="view-tabs" id="viewTabs" aria-label="Task views"></nav>

      <div class="toolbar">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="search" class="input" id="searchInput" placeholder="Search by title…" aria-label="Search by task title" autocomplete="off">
        </div>
        <select class="select" id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option></select>
        <select class="select" id="priorityFilter" aria-label="Filter by priority">
          <option value="">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select class="select" id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
        <select class="select" id="sortSelect" aria-label="Sort tasks">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="due_date">Due date</option>
        </select>
      </div>

      <div class="results-bar">
        <span id="resultsCount" aria-live="polite"></span>
        <span>
          <button class="btn btn-ghost btn-sm" id="clearFilters" hidden><i data-lucide="x"></i>Clear filters</button>
          <a href="settings.html#categories" class="btn btn-ghost btn-sm"><i data-lucide="tags"></i>Manage categories</a>
        </span>
      </div>

      <div id="taskList"></div>
      </main>
    </div>
  </div>
  <div id="toastContainer"></div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
